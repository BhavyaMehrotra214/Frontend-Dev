<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borders and Padding Demonstration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Borders and Padding Demonstration</h1>
  <div class="container">
    <div class="box solid">Solid Border</div>
    <div class="box dashed">Dashed Border</div>
    <div class="box double">Double Border</div>
    <div class="box groove">Groove Border</div>
  </div>

  <h2>Rounded Corners & Different Padding</h2>
  <div class="container">
    <div class="box rounded small-padding">Small Padding</div>
    <div class="box rounded medium-padding">Medium Padding</div>
    <div class="box rounded large-padding">Large Padding</div>
  </div>
</body>
</html>
