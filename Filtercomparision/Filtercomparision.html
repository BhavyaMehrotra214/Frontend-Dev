<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="Filtercomparision.css">
</head>
<body>

  <section class="comparison-section">
    <h1>Before & After Filter Comparison</h1>

    <div class="comparison-container">
      <div class="image-box">
        <img src="https://picsum.photos/id/1015/600/400" alt="Original">
        <p class="caption">Before (Original)</p>
      </div>


      <div class="image-box filtered">
        <img src="https://picsum.photos/id/1015/600/400" alt="Filtered">
        <p class="caption">After (Filter Applied)</p>
      </div>
    </div>
  </section>

</body>
</html>
