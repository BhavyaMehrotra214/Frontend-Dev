<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Report Card</title>
</head>
<body>

  <h1 title="Springfield High School Report Card">Springfield High School</h1>

  <h2>Student Report Card</h2>

  <table border="1" cellpadding="8" cellspacing="0" width="60%">
    <thead>
      <tr>
        <th rowspan="2">Subject</th>
        <th colspan="2">Marks</th>
      </tr>
      <tr>
        <th>Obtained</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody>
      <tr title="English Language and Literature">
        <td>English</td>
        <td>88</td>
        <td>100</td>
      </tr>
      <tr title="Mathematics (Algebra & Geometry)">
        <td>Mathematics</td>
        <td>92</td>
        <td>100</td>
      </tr>
      <tr title="Fundamentals of Science">
        <td>Science</td>
        <td>85</td>
        <td>100</td>
      </tr>
      <tr title="Geography and History">
        <td>Social Studies</td>
        <td>90</td>
        <td>100</td>
      </tr>
      <tr title="Second Language Hindi">
        <td>Hindi</td>
        <td>80</td>
        <td>100</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <th colspan="1">Total</th>
        <td colspan="2">435 / 500</td>
      </tr>
      <tr>
        <th colspan="1">Percentage</th>
        <td colspan="2">87%</td>
      </tr>
    </tfoot>
  </table>

  <p><strong>Note:</strong> This report card is for academic year 2024–2025.</p>

</body>
</html>
