<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Selection Page</title>
</head>
<body>

  <h1>Travel Destination Selector</h1>

  <form>
    <!-- Country Dropdown -->
    <label for="country">Select Country:</label>
    <select id="country" name="country">
      <option selected>India</option>
      <option>Japan</option>
      <option>France</option>
      <option>Australia</option>
      <option>USA</option>
    </select>
    <br><br>

    <!-- State Dropdown -->
    <label for="state">Select State:</label>
    <select id="state" name="state">
      <option selected>Maharashtra</option>
      <option>Karnataka</option>
      <option>Tamil Nadu</option>
      <option>Delhi</option>
      <option>Gujarat</option>
    </select>
    <br><br>

    <!-- City Dropdown -->
    <label for="city">Select City:</label>
    <select id="city" name="city">
      <option selected>Mumbai</option>
      <option>Bangalore</option>
      <option>Chennai</option>
      <option>New Delhi</option>
      <option>Ahmedabad</option>
    </select>
    <br><br>

    <!-- Favorite Tourist Place Dropdown -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
      <option selected>Gateway of India</option>
      <option>Taj Mahal</option>
      <option>Red Fort</option>
      <option>Charminar</option>
      <option>India Gate</option>
    </select>
  </form>

  <br>

  <p>
    You have selected <strong>India</strong> → <strong>Maharashtra</strong> → <strong>Mumbai</strong>, 
    and your favorite tourist place is <strong>Gateway of India</strong>.
  </p>

</body>
</html>
