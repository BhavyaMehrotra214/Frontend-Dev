<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="imagefilter.css">
</head>
<body>
  <h1 class="title">Responsive Image Filter Gallery</h1>

  <div class="gallery">
    <div class="image-card">
      <img src="https://picsum.photos/id/1015/400/300" alt="Blur Filter">
      <p>Blur Filter</p>
    </div>
    <div class="image-card">
      <img src="https://picsum.photos/id/1025/400/300" alt="Grayscale Filter">
      <p>Grayscale Filter</p>
    </div>
    <div class="image-card">
      <img src="https://picsum.photos/id/1035/400/300" alt="Sepia Filter">
      <p>Sepia Filter</p>
    </div>
    <div class="image-card">
      <img src="https://picsum.photos/id/1045/400/300" alt="Brightness Filter">
      <p>Brightness Filter</p>
    </div>
    <div class="image-card">
      <img src="https://picsum.photos/id/1055/400/300" alt="Contrast Filter">
      <p>Contrast Filter</p>
    </div>
    <div class="image-card">
      <img src="https://picsum.photos/id/1065/400/300" alt="Hue-Rotate Filter">
      <p>Hue-Rotate Filter</p>
    </div>
  </div>
</body>
</html>
