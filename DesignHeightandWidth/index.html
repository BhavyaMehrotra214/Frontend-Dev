<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Height and Width Practice Layout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Height and Width Practice Layout</h1>
  <div class="container">
    <div class="box box1">
      <p>Box 1<br>(Width: 200px, Height: 150px)</p>
    </div>
    <div class="box box2">
      <p>Box 2<br>(Width: 40%, Height: 30vh)</p>
    </div>
    <div class="box box3">
      <p>
        Box 3<br>(Width: 20em, min-height: 100px, max-width: 300px)<br>
        This box demonstrates overflow with extra content that will scroll if it exceeds its height limit.
      </p>
    </div>
  </div>
</body>
</html>
